<svg fill="none" viewBox="0 0 1000 30" width="100%" height="30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F5D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF007F" stop-opacity="1" />
      <stop offset="80%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Line -->
  <line x1="50" y1="15" x2="950" y2="15" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)" />
  
  <!-- Center Diamond & Circuit Nodes -->
  <rect x="492" y="7" width="16" height="16" transform="rotate(45 500 15)" fill="#07090e" stroke="#00F5D4" stroke-width="2" filter="url(#glow)" />
  <circle cx="500" cy="15" r="3" fill="#FF007F" />

  <circle cx="300" cy="15" r="4" fill="#00F5D4" filter="url(#glow)" />
  <circle cx="700" cy="15" r="4" fill="#7928CA" filter="url(#glow)" />
</svg>
